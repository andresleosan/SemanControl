name = "semancontrol"
main = ".open-next/worker.js"
compatibility_date = "2026-10-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
# Identificador público; coincide con el SDK web y producción.
FIREBASE_PROJECT_ID = "semancontrolapp"
# Origen público confiable: Next.js reconstruye internamente el URL en Workers.
APP_ORIGIN = "http://localhost:3000"

[[d1_databases]]
binding = "DB"
database_name = "semancontrol-db"
# Solo desarrollo local. Sustituir por el UUID real antes de desplegar.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS_BUCKET"
bucket_name = "semancontrol-receipts"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "semancontrol"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
